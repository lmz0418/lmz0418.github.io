  <script>
    // A lightweight cinema for wheel and touch; the native portfolio is the fallback.
    (()=>{
      let auto=(!location.hash||location.hash==='#cinema')&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!navigator.connection?.saveData;
      const guard=new AbortController();
      const cancelAuto=()=>{auto=false;document.documentElement.classList.remove('desktop-cinema-pending');guard.abort();};
      if(auto)document.documentElement.classList.add('desktop-cinema-pending');
      document.addEventListener('click',event=>{if(event.target.closest('a[href="#portfolio"],a[href="#contact"]'))cancelAuto();},{capture:true,signal:guard.signal});
      addEventListener('hashchange',()=>{if(location.hash&&location.hash!=='#cinema')cancelAuto();},{signal:guard.signal});
      const watchdog=setTimeout(cancelAuto,6000);
      addEventListener('DOMContentLoaded',()=>import('./desktop-cinema.js?v=20261030-touch1')
        .then(module=>module.initDesktopCinema({auto:auto&&(!location.hash||location.hash==='#cinema')}))
        .catch(()=>document.documentElement.classList.remove('desktop-cinema-pending'))
        .finally(()=>{clearTimeout(watchdog);guard.abort();}),{once:true});
    })();
  </script>
  <style>html.desktop-cinema-pending #portfolio{display:none!important}</style>
  <script type="module" src="portfolio-home.js?v=20261030-smooth1"></script>
